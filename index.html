<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<meta name="google" content="notranslate" />
		<title>Seixal Clube 1925</title>
		<link rel="icon" type="image/svg+xml" href="/logo.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			// Apply the saved or system theme before first paint (see src/lib/theme.ts)
			(function () {
				var t;
				try {
					t = localStorage.getItem('theme');
				} catch (e) {}
				if (t !== 'light' && t !== 'dark')
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = t;
			})();
		</script>
	</head>
	<body>
		<noscript>É necessário ativar o JavaScript para usar esta aplicação.</noscript>
		<div id="root"></div>
		<script src="/src/index.tsx" type="module"></script>
	</body>
</html>
